async function loadCollection(name, docId) {
    try {
        if (docId) { const s = await getDoc(doc(db, name, docId)); return s.exists() ? s.data() : null; }
        const snap = await getDocs(collection(db, name));
        const arr = []; snap.forEach(d => arr.push({ docId: d.id, ...d.data() })); return arr;
    } catch(e) { return null; }
}

window.preloadEverything = async function() {
    try {
        const [setS, pS, bS, hcS, cS, fS, pgS, rS] = await Promise.all([
            loadCollection('settings','store'), loadCollection('products'), loadCollection('banners'),
            loadCollection('homeCollections'), loadCollection('coupons'), loadCollection('faq'),
            loadCollection('pages'), loadCollection('reviews')
        ]);
        if (setS) { const m={...DEFAULT_SETTINGS,...setS}; fcSet('settings',m); window.settingsCache=m; applySettingsToWebsite(); applyExtendedSettings(); }
        if (pS) { pS.sort((a,b)=>(parseInt(a.id)||0)-(parseInt(b.id)||0)); fcSet('products',pS); window.productsCache=pS; updateProductsData(pS); }
        if (bS) { const act=bS.filter(x=>x.active!==false).sort((a,b)=>(parseInt(a.order)||99)-(parseInt(b.order)||99)); fcSet('banners',act); window.bannersCache=act; renderBannerSlider(); }
        if (hcS) { const act=hcS.filter(x=>x.enabled!==false).sort((a,b)=>(parseInt(a.order)||99)-(parseInt(b.order)||99)); fcSet('homeCollections',act); window.homeCollectionsCache=act; renderHomeCollections(); }
        if (cS) { fcSet('coupons',cS); window.couponsCache=cS; renderHomeCoupons(); }
        if (fS) { fS.sort((a,b)=>(parseInt(a.order)||99)-(parseInt(b.order)||99)); fcSet('faq',fS); window.faqCache=fS; renderFAQ(); }
        if (pgS) { const o={}; pgS.forEach(p=>{o[p.pageId||p.docId]=p}); fcSet('pages',o); window.pagesCache=o; renderSidebarMenu(); }
        if (rS) { const o={}; rS.forEach(r=>{const pid=r.productId; if(!o[pid])o[pid]=[]; o[pid].push(r)}); fcSet('reviews',o); window.reviewsCache=o; }
    } catch(e) { console.warn('preload error',e); }
};

window.applySettingsToWebsite = function() {
    const s = window.settingsCache || DEFAULT_SETTINGS;
    if (s.pageTitle) document.title = s.pageTitle;
    document.querySelectorAll('.dynamic-store-name').forEach(el=>el.textContent=s.storeName||'');
    document.querySelectorAll('.dynamic-welcome-text').forEach(el=>el.textContent=s.welcomeText||'');
    document.querySelectorAll('.dynamic-copyright').forEach(el=>el.textContent=s.copyrightText||'');
    document.querySelectorAll('.dynamic-whatsapp-link').forEach(el=>{ if(el.tagName==='A' && s.contactFields){ const wa=s.contactFields.find(f=>/whatsapp/i.test(f.label)); if(wa){ const num=(wa.value||'').replace(/[^0-9]/g,''); el.href='https://wa.me/'+num; } } });
};

window.applyExtendedSettings = function() {
    const s = window.settingsCache || DEFAULT_SETTINGS;
    const logo = s.logoUrl || DEFAULT_SETTINGS.logoUrl;
    document.querySelectorAll('.dynamic-logo').forEach(el=>{ if(el.tagName==='IMG') el.src=logo; });
    const fav=document.querySelector('link[rel="icon"]'); if(fav) fav.href=logo;
    if (typeof renderContactIconsOnWebsite==='function') renderContactIconsOnWebsite();
    if (typeof renderFooterSections==='function') renderFooterSections();
};

window.renderContactIconsOnWebsite = function() {
    const s = window.settingsCache || DEFAULT_SETTINGS;
    const icons = Array.isArray(s.contactIcons) ? s.contactIcons.filter(x=>x.enabled!==false) : [];
    document.querySelectorAll('.dynamic-contact-icons-container').forEach(c=>{
        if (icons.length===0) { c.innerHTML=''; return; }
        let html='';
        icons.forEach(ic=>{
            const l=(ic.label||'').toUpperCase();
            let val=ic.value||'';
            if (!val && s.contactFields) { const f=s.contactFields.find(x=>x.label.toUpperCase()===l); if(f) val=f.value; }
            const link=ic.linkUrl||''; const tag=link?`<a href="${link}" class="contact-value" target="_blank">${val||ic.label}</a>`:`<span class="contact-value">${val||ic.label}</span>`;
            html+=`<div class="contact-card"><img src="${ic.iconUrl||''}" class="contact-icon-img" onerror="this.style.display='none'"><div class="contact-info"><span class="contact-label">${ic.label||''}</span>${tag}</div></div>`;
        });
        c.innerHTML=html;
    });
};

window.renderFooterSections = function() {
    const s = window.settingsCache || DEFAULT_SETTINGS;
    const sections = Array.isArray(s.footerSections) ? s.footerSections : [];
    const cont = document.getElementById('footer-dynamic-sections'); if(!cont) return;
    if (sections.length===0) { cont.innerHTML=''; return; }
    let html='';
    sections.forEach(sec=>{
        const links = Array.isArray(sec.links) ? sec.links.filter(l=>l.enabled!==false) : [];
        html+=`<div class="footer-section"><h4>${sec.title||''}</h4><ul class="footer-links">`;
        links.forEach(l=>{ html+=`<li><a href="${l.url||'#'}" ${l.url&&l.url.startsWith('http')?'target="_blank"':''} ${l.url&&l.url.startsWith('tab:')?`onclick="event.preventDefault();switchTab('${l.url.replace('tab:','')}')"`:''}>${l.label||''}</a></li>`; });
        html+='</ul></div>';
    });
    // Social icons from settings.socialLinks
    const socials = Array.isArray(s.socialLinks) ? s.socialLinks : [];
    if (socials.length>0) {
        html+=`<div class="footer-section" style="text-align:center;margin-top:10px;"><h4>Follow Us</h4><div class="social-icons-row">`;
        socials.forEach(sl=>{
            const p=(sl.platform||'').toLowerCase();
            let icon='fa-link', bg='#666';
            if (p.includes('facebook')){icon='fa-facebook-f';bg='#1877f2';}
            else if (p.includes('instagram')){icon='fa-instagram';bg='linear-gradient(135deg,#f09433,#dc2743,#bc1888)';}
            else if (p.includes('whatsapp')){icon='fa-whatsapp';bg='#25d366';}
            else if (p.includes('youtube')){icon='fa-youtube';bg='#ff0000';}
            else if (p.includes('tiktok')){icon='fa-tiktok';bg='#000';}
            html+=`<a href="${sl.url||'#'}" target="_blank" class="social-icon" style="background:${bg}"><i class="fab ${icon}"></i></a>`;
        });
        html+='</div></div>';
    }
    cont.innerHTML=html;
};

// ⚡ VERSION CHECK — 15 sec
let lastMetaVersion = 0;
window.startVersionCheck = function() {
    setInterval(async function() {
        if (document.hidden) return;
        try {
            const meta = await loadCollection('settings','meta');
            if (meta && meta.version && meta.version !== lastMetaVersion) {
                if (lastMetaVersion !== 0) {
                    const tt = document.getElementById('sync-toast');
                    if (tt) { tt.classList.add('show'); setTimeout(()=>tt.classList.remove('show'),2500); }
                    await preloadEverything();
                }
                lastMetaVersion = meta.version;
            }
        } catch(e) {}
    }, 15000);
};

// 🔴 NEW BADGE — newest createdAt per category
window.getNewestProductIds = function() {
    const products = window.productsCache || [];
    const newest = {};
    products.forEach(p => { const cat=p.category||'x'; const cAt=new Date(p.createdAt||0).getTime(); if(!newest[cat]||cAt>newest[cat].t) newest[cat]={id:p.docId||p.id,t:cAt}; });
    return new Set(Object.values(newest).map(x=>String(x.id)));
};

window.updateProductsData = function(arr) {
    if (!Array.isArray(arr)) return;
    window.productsCache = arr;
    window.productsData = arr.map(p => {
        const mainImg = extractUrl(p.image)||p.image||DEFAULT_SETTINGS.logoUrl;
        let colors = Array.isArray(p.colors)&&p.colors.length>0 ? p.colors.map(c=>({name:c.name||'Default',image:extractUrl(c.image)||c.image||mainImg})) : [{name:'Default',image:mainImg}];
        let images = Array.isArray(p.images)&&p.images.length>0 ? p.images.map(i=>extractUrl(i)||i).filter(i=>i&&i.length>5) : [mainImg];
        let price = p.price; if(typeof price==='string' && !price.toLowerCase().includes('coming')){ const v=parseInt(price.replace(/[^0-9]/g,'')); price=isNaN(v)?'Coming Soon':v; }
        return { docId:p.docId, id:parseInt(p.id)||Math.random()*100000, name:p.name||'Product', category:p.category||'', price, stock:p.stock!==undefined?parseInt(p.stock)||0:1, image:mainImg, video:p.video||null, sizes:Array.isArray(p.sizes)?p.sizes:[], colors, images, fullDescription:p.fullDescription||'<p></p>', createdAt:p.createdAt||null };
    });
    window.productsData.sort((a,b)=>a.id-b.id);
    renderProducts(window.productsData);
};

window.extractUrl = function(str) {
    if (!str || typeof str!=='string') return '';
    const t = str.trim();
    const m = t.match(/src=["']([^"']+)["']/);
    if (m && m[1]) return m[1];
    if (t.startsWith('http')) return t.split(/[\s<"']/)[0];
    return '';
};

// ===== RENDER PRODUCTS =====
const PER_PAGE = 12;
let currentPage = 1, currentFiltered = [];

window.renderProductsGrid = function(items) {
    const grid = document.getElementById('product-grid-container'); if(!grid) return;
    if (!items || items.length===0) { grid.innerHTML='<p style="grid-column:span 2;text-align:center;color:var(--muted);padding:30px;">কোনো প্রোডাক্ট নেই</p>'; return; }
    const newestIds = getNewestProductIds();
    const wishlist = JSON.parse(localStorage.getItem('bq_wishlist')||'[]');
    let html='';
    items.forEach(p=>{
        const priceTxt = typeof p.price==='number'?('৳ '+p.price):p.price;
        const isOOS = p.stock===0;
        const isNew = newestIds.has(String(p.docId));
        const isWish = wishlist.includes(p.docId);
        let badge = '';
        if (isOOS) badge='<span class="product-badge" style="background:linear-gradient(135deg,#666,#333)">SOLD OUT</span>';
        else if (isNew) badge='<span class="product-badge new">NEW</span>';
        html+=`<div class="product-card" onclick="openProductDetails('${p.docId}')"><div class="product-img-box">${badge}${isOOS?'<div class="out-of-stock-overlay"><span>Out</span></div>':''}<button class="wishlist-btn-small ${isWish?'active':''}" data-pid="${p.docId}" onclick="event.stopPropagation();toggleWishlist('${p.docId}')"><i class="fas fa-heart"></i></button><img src="${p.image}" loading="lazy" onerror="this.src='${DEFAULT_SETTINGS.logoUrl}'"></div><div class="product-info"><span class="product-category-tag">${p.category}</span><div class="product-title">${p.name}</div><div class="product-price-row"><span class="product-price">${priceTxt}</span><button class="add-to-cart-grid-btn" onclick="event.stopPropagation();quickAddToCart('${p.docId}')" ${isOOS?'disabled':''}><i class="fas fa-shopping-bag"></i></button></div></div></div>`;
    });
    grid.innerHTML=html;
};

window.paginate = function(items, page) { const s=(page-1)*PER_PAGE; return items.slice(s,s+PER_PAGE); };

window.renderPagination = function() {
    const total=currentFiltered.length, pages=Math.ceil(total/PER_PAGE);
    const top=document.getElementById('pagination-info-top'), wrap=document.getElementById('pagination-wrap');
    if (pages<=1){ if(top)top.style.display='none'; if(wrap)wrap.style.display='none'; return; }
    if(top){ top.style.display='block'; top.innerHTML=`<strong>${(currentPage-1)*PER_PAGE+1}–${Math.min(currentPage*PER_PAGE,total)}</strong> / ${total}`; }
    let html=`<button class="pagination-btn" onclick="goToPage(${currentPage-1})" ${currentPage===1?'disabled':''}><i class="fas fa-chevron-left"></i></button>`;
    for (let i=1; i<=pages; i++){ if (i===1||i===pages||Math.abs(i-currentPage)<=1) html+=`<button class="pagination-btn ${i===currentPage?'active':''}" onclick="goToPage(${i})">${i}</button>`; else if (Math.abs(i-currentPage)===2) html+='<span style="color:var(--muted);">…</span>'; }
    html+=`<button class="pagination-btn" onclick="goToPage(${currentPage+1})" ${currentPage===pages?'disabled':''}><i class="fas fa-chevron-right"></i></button>`;
    if(wrap){ wrap.style.display='flex'; wrap.innerHTML=html; }
};

window.goToPage = function(p) { const total=Math.ceil(currentFiltered.length/PER_PAGE); if(p<1||p>total||p===currentPage)return; currentPage=p; renderProductsGrid(paginate(currentFiltered,currentPage)); renderPagination(); const s=document.getElementById('shop-section'); if(s) window.scrollTo({top:s.offsetTop-80,behavior:'smooth'}); };

window.renderProducts = function(items) { currentFiltered = items||[]; currentPage=1; renderProductsGrid(paginate(currentFiltered,1)); renderPagination(); };

window.filterCategory = function(cat) {
    document.querySelectorAll('.filter-chip').forEach(c=>c.classList.toggle('active', c.getAttribute('data-cat')===cat));
    const filtered = cat==='all' ? (window.productsData||[]) : (window.productsData||[]).filter(p=>p.category===cat);
    document.getElementById('shop-title').textContent = cat==='all' ? t('সব কালেকশন','All Collections') : cat;
    renderProducts(filtered);
    switchTab('shop');
};

window.filterProductsBySearch = function() {
    const q=(document.getElementById('search-input').value||'').toLowerCase();
    if(!q.trim()) { renderProducts(window.productsData||[]); return; }
    const f=(window.productsData||[]).filter(p=>p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q));
    document.getElementById('shop-title').textContent = t('সার্চ ফলাফল','Search Results');
    renderProducts(f);
    switchTab('shop');
};

// ===== WISHLIST =====
function getWishlist() { return JSON.parse(localStorage.getItem('bq_wishlist')||'[]'); }
function saveWishlist(w) { localStorage.setItem('bq_wishlist',JSON.stringify(w)); updateWishlistBadge(); }

window.toggleWishlist = function(docId) {
    let w = getWishlist();
    const i = w.indexOf(docId);
    if (i>-1) { w.splice(i,1); showToast('💔'); } else { w.push(docId); showToast('❤️'); }
    saveWishlist(w);
    document.querySelectorAll('.wishlist-btn-small').forEach(b=>{ if(b.getAttribute('data-pid')===docId) b.classList.toggle('active',w.includes(docId)); });
    if (document.getElementById('wishlist-section').classList.contains('active-page')) renderWishlist();
};

function updateWishlistBadge() {
    const c=getWishlist().length; const el=document.getElementById('wishlist-count'); if(el){ el.textContent=c; el.style.display=c>0?'inline-block':'none'; }
    const pc=document.getElementById('wishlist-page-count'); if(pc)pc.textContent=getWishlist().length;
}

window.renderWishlist = function() {
    const cont=document.getElementById('wishlist-container'); if(!cont)return;
    updateWishlistBadge();
    const ids=getWishlist();
    const items=(window.productsData||[]).filter(p=>ids.includes(p.docId));
    if(items.length===0){ cont.innerHTML=`<div class="wishlist-empty"><i class="fas fa-heart-broken"></i><h3>${t('Wishlist খালি','Wishlist empty')}</h3><button class="wishlist-shop-btn" onclick="switchTab('shop')">Shop Now</button></div>`; return; }
    let html='<div class="wishlist-grid">';
    items.forEach(p=>{ const priceTxt=typeof p.price==='number'?('৳ '+p.price):p.price; html+=`<div class="wishlist-card"><div class="wishlist-card-img-box" onclick="openProductDetails('${p.docId}')"><button class="wishlist-remove-btn" onclick="event.stopPropagation();toggleWishlist('${p.docId}')"><i class="fas fa-heart"></i></button><img src="${p.image}"></div><div class="wishlist-card-info"><span class="product-category-tag">${p.category}</span><div class="product-title" style="margin:5px 0;">${p.name}</div><div class="product-price-row"><span class="product-price">${priceTxt}</span><button class="add-to-cart-grid-btn" onclick="event.stopPropagation();openProductDetails('${p.docId}')">Add</button></div></div></div>`; });
    html+='</div>'; cont.innerHTML=html;
};

window.clearAllWishlist = function() { if(!confirm(t('সব মুছবেন?','Clear all?')))return; saveWishlist([]); renderWishlist(); };

// ===== BANNERS =====
let currentBanner=0, bannerTimer=null;
window.renderBannerSlider = function() {
    const slider=document.getElementById('promo-banner-slider'), track=document.getElementById('banner-track'), dots=document.getElementById('banner-dots');
    if(!slider||!track)return;
    const b=window.bannersCache||[];
    if(b.length===0){ slider.style.display='none'; return; }
    slider.style.display='block';
    let s='';
    b.forEach((bn,i)=>{ s+=`<div class="banner-slide"><img src="${extractUrl(bn.image)||bn.image}" loading="${i===0?'eager':'lazy'}"></div>`; });
    track.innerHTML=s;
    if(b.length>1){ let d=''; b.forEach((_,i)=>{ d+=`<button class="banner-dot ${i===currentBanner?'active':''}" onclick="goToBanner(${i})"></button>`; }); dots.innerHTML=d; dots.style.display='flex'; }
    else dots.style.display='none';
    if(currentBanner>=b.length) currentBanner=0;
    track.style.transform=`translateX(-${currentBanner*100}%)`;
    if(bannerTimer) clearInterval(bannerTimer);
    if(b.length>1) bannerTimer=setInterval(()=>{ currentBanner=(currentBanner+1)%b.length; track.style.transform=`translateX(-${currentBanner*100}%)`; document.querySelectorAll('.banner-dot').forEach((d,i)=>d.classList.toggle('active',i===currentBanner)); },5000);
};
window.goToBanner = function(i) { const b=window.bannersCache||[]; if(i<0||i>=b.length)return; currentBanner=i; renderBannerSlider(); };
window.bannerNext = ()=>{ const b=window.bannersCache||[]; if(b.length<=1)return; currentBanner=(currentBanner+1)%b.length; renderBannerSlider(); };
window.bannerPrev = ()=>{ const b=window.bannersCache||[]; if(b.length<=1)return; currentBanner=(currentBanner-1+b.length)%b.length; renderBannerSlider(); };

// ===== RATING =====
function getReviews(pid){ const r=window.reviewsCache||{}; return r[pid]||[]; }
function calcRating(pid){ const r=getReviews(pid); if(r.length===0)return{avg:0,total:0,dist:{}}; const dist={5:0,4:0,3:0,2:0,1:0}; let s=0; r.forEach(x=>{const v=parseInt(x.rating)||0; s+=v; if(dist[v]!==undefined)dist[v]++;}); return{avg:(s/r.length).toFixed(1),total:r.length,dist}; }
window.renderRatingSection = function(pid){ const st=calcRating(pid); const revs=getReviews(pid); let bars=''; for(let i=5;i>=1;i--){ const c=st.dist[i]||0; const pct=st.total>0?(c/st.total)*100:0; bars+=`<div class="rating-bar-row"><span style="width:25px;color:var(--muted);">${i}★</span><div class="rating-bar-track"><div class="rating-bar-fill" style="width:${pct}%"></div></div><span style="width:20px;text-align:right;color:var(--muted);font-size:10px;">${c}</span></div>`; } let rhtml=''; if(revs.length===0)rhtml='<p style="text-align:center;color:var(--muted);font-size:12px;padding:10px;">প্রথম রিভিউ আপনি দিন!</p>'; else revs.slice(0,10).forEach(r=>{ rhtml+=`<div class="review-card"><div style="display:flex;justify-content:space-between;align-items:center;"><span class="review-name">${r.name||'Anonymous'}</span><span class="review-stars">${'★'.repeat(parseInt(r.rating)||0)}</span></div><p class="review-text">${r.text||''}</p><p class="review-date">${r.date?new Date(r.date).toLocaleDateString():''}</p></div>`; }); return `<div class="rating-summary"><div style="text-align:center;min-width:70px;padding-right:10px;border-right:1px solid var(--border);"><div class="rating-average">${st.avg||'0.0'}</div><div style="color:#ffb800;font-size:13px;">${'★'.repeat(Math.round(parseFloat(st.avg)||0))}</div><div class="rating-total">${st.total} reviews</div></div><div class="rating-bars">${bars}</div></div><div class="review-section"><h3>✍️ Write a Review</h3><div class="star-picker" id="star-picker">${[1,2,3,4,5].map(i=>`<i class="fas fa-star star" onclick="setRating(${i})"></i>`).join('')}</div><input type="text" class="review-input" id="rev-name" placeholder="${t('আপনার নাম *','Your name *')}"><textarea class="review-textarea" id="rev-text" rows="2" placeholder="${t('রিভিউ লিখুন','Write review')}"></textarea><button class="submit-review-btn" onclick="submitReview('${pid}')"><i class="fas fa-paper-plane"></i> ${t('সাবমিট','Submit')}</button></div><div class="review-list">${rhtml}</div>`; };

window.setRating = function(r){ currentRating=r; document.querySelectorAll('#star-picker .star').forEach((s,i)=>s.classList.toggle('active',i<r)); };

window.submitReview = async function(pid){ if(currentRating===0){showToast('⚠️ Rating');return;} const name=document.getElementById('rev-name').value.trim(); const text=document.getElementById('rev-text').value.trim(); if(!name){showToast('⚠️ Name');return;} try{ await addDoc(collection(db,'reviews'),{productId:pid,name,rating:currentRating,text:text||'(no comment)',date:new Date().toISOString()}); showToast('✅'); if(!window.reviewsCache)window.reviewsCache={}; if(!window.reviewsCache[pid])window.reviewsCache[pid]=[]; window.reviewsCache[pid].unshift({productId:pid,name,rating:currentRating,text,date:new Date().toISOString()}); openProductDetails(pid); }catch(e){showToast('❌ '+e.message);} };

window.renderRelated = function(p){ let rel=(window.productsData||[]).filter(x=>x.category===p.category&&x.docId!==p.docId).slice(0,3); if(rel.length<2)rel=rel.concat((window.productsData||[]).filter(x=>x.docId!==p.docId&&x.category!==p.category).slice(0,3-rel.length)); if(rel.length===0)return''; let h='<div class="related-section"><div class="related-title">✨ You May Also Like</div><div class="related-grid">'; rel.forEach(r=>{ const pt=typeof r.price==='number'?('৳ '+r.price):r.price; h+=`<div class="product-card" onclick="openProductDetails('${r.docId}')"><div class="product-img-box"><img src="${r.image}"></div><div class="product-info"><div class="product-title">${r.name}</div><div class="product-price">${pt}</div></div></div>`; }); h+='</div></div>'; return h; };

window.openVideoModal = function(url){ const embed=convertVideo(url); if(!embed){showToast('❌ Video link unsupported');return;} const m=document.getElementById('video-modal'); document.getElementById('video-iframe').src=embed+'?autoplay=1&rel=0'; m.classList.add('active'); document.body.style.overflow='hidden'; };

function convertVideo(url){ if(!url)return''; let m=url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/); if(m)return'https://www.youtube.com/embed/'+m[1]; if(url.includes('facebook.com'))return'https://www.facebook.com/plugins/video.php?href='+encodeURIComponent(url); m=url.match(/vimeo\.com\/(\d+)/); if(m)return'https://player.vimeo.com/video/'+m[1]; return''; }

// ===== CART =====
function getCart(){ try{return JSON.parse(localStorage.getItem('bq_cart')||'[]')}catch(e){return[]} }
function saveCart(c){ localStorage.setItem('bq_cart',JSON.stringify(c)); updateCartBadge(); }
function updateCartBadge(){ const c=getCart(); const n=c.reduce((s,i)=>s+(i.quantity||1),0); const el=document.getElementById('cart-count'); if(el){ el.textContent=n; el.style.display=n>0?'inline-block':'none'; } }

function addToCart(p,size,color){ const cart=getCart(); const key=p.docId+'_'+(size||'x')+'_'+(color||'x'); const ex=cart.find(i=>i.key===key); if(ex)ex.quantity+=1; else cart.push({key,docId:p.docId,name:p.name,price:p.price,image:p.image,size,color,quantity:1}); saveCart(cart); showToast('✅ '+t('যোগ হয়েছে','Added')); setTimeout(()=>renderMiniCart(),100); }

window.updateCartUI = function() {
    const cont=document.getElementById('cart-items-container'); if(!cont)return;
    const cart=getCart();
    if(cart.length===0){ cont.innerHTML=`<div style="text-align:center;padding:40px 20px;"><i class="fas fa-shopping-cart" style="font-size:40px;color:var(--gold);margin-bottom:12px;"></i><p style="color:var(--muted);">${t('কার্ট খালি','Cart empty')}</p></div>`; return; }
    const s=window.settingsCache||DEFAULT_SETTINGS;
    let subtotal=0, hasComing=false;
    let html='<h3 style="color:var(--gold);margin-bottom:12px;font-size:15px;">'+t('নির্বাচিত আইটেম','Selected Items')+'</h3><ul style="list-style:none;padding:0;margin-bottom:15px;">';
    cart.forEach((it,i)=>{ const lineTotal=typeof it.price==='number'?it.price*it.quantity:0; if(typeof it.price==='number')subtotal+=lineTotal; else hasComing=true; const pt=typeof it.price==='number'?('৳ '+it.price+' × '+it.quantity+' = <strong>৳ '+lineTotal+'</strong>'):'<span style="color:#ffb15b;">Coming Soon</span>'; let meta=[]; if(it.size)meta.push('Size: '+it.size); if(it.color)meta.push('Color: '+it.color); const mt=meta.join(' • '); html+=`<li class="cart-row"><div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;"><img src="${it.image}" class="cart-item-img"><div style="min-width:0;"><div style="font-weight:600;font-size:13px;">${it.name}</div>${mt?`<div style="font-size:10px;color:var(--muted);">${mt}</div>`:''}<div style="color:var(--gold);font-size:12px;margin-top:3px;">${pt}</div></div></div><div style="display:flex;align-items:center;gap:6px;"><div class="qty-control"><button class="qty-btn" onclick="changeQty(${i},-1)">-</button><span style="font-weight:bold;min-width:18px;text-align:center;font-size:12px;">${it.quantity}</span><button class="qty-btn" onclick="changeQty(${i},1)">+</button></div><button class="remove-item-btn" onclick="removeFromCart(${i})"><i class="fas fa-trash"></i></button></div></li>`; });
    html+='</ul>';
    const discount=window.appliedCoupon?calcDiscount(subtotal,window.appliedCoupon):0;
    const dfi=s.deliveryInside||60;
    const total=Math.max(0,subtotal-discount)+dfi;
    html+=`<div style="background:var(--bg);padding:12px;border-radius:8px;margin-bottom:15px;border:1px solid var(--border);"><div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px;"><span>Subtotal:</span><span>৳ ${subtotal}${hasComing?' +':''}</span></div>${window.appliedCoupon?`<div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px;color:var(--ok);"><span>🎟️ Discount:</span><span>- ৳ ${discount}</span></div>`:''}<div style="display:flex;justify-content:space-between;font-weight:bold;font-size:15px;color:var(--gold);border-top:1px solid var(--border);margin-top:6px;padding-top:6px;"><span>Total:</span><span id="cart-total">৳ ${total}${hasComing?' +':''}</span></div></div>`;
    html+=`<h3 style="color:var(--gold);margin-bottom:12px;font-size:15px;">${t('ডেলিভারি তথ্য','Delivery Information')}</h3><form id="checkout-form" onsubmit="submitOrder(event)">
        <div class="form-group"><label>${t('আপনার পুরো নাম *','Full Name *')}</label><input type="text" id="cus-name" required></div>
        <div class="form-group"><label>${t('আপনার সচল নাম্বার *','Verified Number *')}</label><input type="tel" id="cus-phone" required></div>
        <div class="form-group"><label>${t('কেনাকাটার যায়গা *','Shopping Area *')}</label><select id="shopping-area" onchange="updateDeliveryCharge()"><option value="${dfi}">${t('ফেনীর ভিতরে','Inside Feni')} - ৳${dfi}</option><option value="${s.deliveryOutside||130}">${t('ফেনীর বাহিরে','Outside Feni')} - ৳${s.deliveryOutside||130}</option></select></div>
        <div class="form-group"><label>${t('জেলা *','Zila *')}</label><select id="cus-zila" required><option value="">${t('নির্বাচন করুন','Select')}</option>${DISTRICTS.map(d=>`<option value="${d[1]}" data-bn="${d[0]}">${LANG==='bn'?d[0]+' / '+d[1]:d[1]+' / '+d[0]}</option>`).join('')}</select></div>
        <div class="form-group"><label>${t('সম্পূর্ণ ঠিকানা *','Full Address *')}</label><textarea id="cus-address" rows="2" required></textarea></div>
        <div class="form-group"><label>${t('নোট (ঐচ্ছিক)','Notes (optional)')}</label><textarea id="cus-notes" rows="2"></textarea></div>
        <h3 style="color:var(--gold);margin:15px 0 8px;">${t('পেমেন্ট মেথড *','Payment Method *')}</h3>
        <div class="payment-methods-box" id="payment-methods-box"></div>
        <div id="instruction-boxes-container"></div>
        <button type="submit" style="margin-top:20px;width:100%;background:var(--gold);color:#0b0b0d;border:none;padding:13px;border-radius:8px;font-weight:bold;font-size:15px;cursor:pointer;"><i class="fas fa-check-circle"></i> ${t('অর্ডার করুন','Place Order')}</button>
    </form>`;
    cont.innerHTML=html;
    renderPaymentMethods();
    updateCartBadge();
};

window.changeQty = function(i,delta){ const cart=getCart(); if(!cart[i])return; cart[i].quantity+=delta; if(cart[i].quantity<=0)cart.splice(i,1); saveCart(cart); updateCartUI(); };
window.removeFromCart = function(i){ const cart=getCart(); cart.splice(i,1); saveCart(cart); updateCartUI(); };

window.renderPaymentMethods = function() {
    const c=document.getElementById('payment-methods-box'); if(!c)return;
    const s=window.settingsCache||DEFAULT_SETTINGS;
    const methods=(s.paymentMethods||[]).filter(m=>m.enabled!==false);
    if(methods.length===0){ c.innerHTML='<p style="color:var(--muted);font-size:12px;">No payment method</p>'; return; }
    let html='';
    methods.forEach((pm,i)=>{ html+=`<label class="payment-option ${i===0?'selected':''}"><input type="radio" name="payment" value="${pm.value||pm.name}" ${i===0?'checked':''} onchange="handlePaymentChange()">${pm.iconUrl?`<img src="${pm.iconUrl}">`:''}<span>${pm.label||pm.name}</span></label>`; });
    c.innerHTML=html;
    handlePaymentChange();
};

window.handlePaymentChange = function() {
    const sel=document.querySelector('input[name="payment"]:checked'); if(!sel)return;
    document.querySelectorAll('.payment-option').forEach(o=>o.classList.toggle('selected',o.querySelector('input').checked));
    const s=window.settingsCache||DEFAULT_SETTINGS;
    const methods=(s.paymentMethods||[]);
    const pm=methods.find(m=>(m.value||m.name)===sel.value);
    const cont=document.getElementById('instruction-boxes-container'); if(!cont)return;
    if(!pm||pm.instructionType==='none'){ cont.innerHTML=''; return; }
    const cart=getCart(); let subtotal=0; cart.forEach(i=>{ if(typeof i.price==='number')subtotal+=i.price*i.quantity; });
    const ship=parseInt(document.getElementById('shopping-area').value)||s.deliveryInside;
    const total=Math.max(0,subtotal)+ship;
    let amt = pm.instructionType==='cod'?ship:total;
    let body='';
    const type=pm.instructionType;
    if(type==='bank'){
        body=`<div style="font-size:12px;line-height:1.7;padding:8px;background:var(--card);border-radius:6px;margin-bottom:8px;">${pm.customInstruction||''}</div>`;
    } else if(type==='custom'){
        body=`<div style="font-size:12px;line-height:1.7;padding:8px;background:var(--card);border-radius:6px;margin-bottom:8px;">${pm.customInstruction||''}</div>`;
    } else if(pm.instructionNumber){
        body=`<div class="number-row"><span style="font-weight:bold;color:var(--gold);font-size:14px;">${pm.instructionNumber}</span><button type="button" class="copy-btn" onclick="copyNumber('${pm.instructionNumber}')"><i class="fas fa-copy"></i></button></div>`;
    }
    if(pm.customInstruction && type!=='bank' && type!=='custom') body+=`<div style="font-size:11px;color:var(--muted);margin-bottom:8px;">${pm.customInstruction}</div>`;
    cont.innerHTML=`<div class="instruction-box active"><h4>${pm.label||pm.name}</h4><p>${type==='cod'?t('ডেলিভারি চার্জ অগ্রিম','Delivery charge advance')+': <strong>৳'+amt+'</strong>':t('সম্পূর্ণ পেমেন্ট','Full payment')+': <strong>৳'+amt+'</strong>'}</p>${body}<div class="form-group"><label>${t('প্রেরকের নম্বর','Sender Number')} *</label><input type="tel" id="pay-sender" required></div><div class="form-group" style="margin-bottom:0;"><label>TrxID *</label><input type="text" id="pay-trx" required></div></div>`;
};

window.updateDeliveryCharge = function() { handlePaymentChange(); };

window.copyNumber = function(n){ navigator.clipboard.writeText(n).then(()=>showToast('✅')); };

window.submitOrder = async function(e) {
    e.preventDefault();
    const name=document.getElementById('cus-name').value.trim();
    const phone=document.getElementById('cus-phone').value.trim();
    const zila=document.getElementById('cus-zila').value;
    const address=document.getElementById('cus-address').value.trim();
    const notes=document.getElementById('cus-notes').value.trim();
    const sel=document.querySelector('input[name="payment"]:checked');
    if(!sel){alert('Payment method select করুন');return;}
    const s=window.settingsCache||DEFAULT_SETTINGS;
    const methods=s.paymentMethods||[];
    const pm=methods.find(m=>(m.value||m.name)===sel.value);
    let sender='', trx='';
    if(pm && pm.instructionType && pm.instructionType!=='none'){
        sender=(document.getElementById('pay-sender')||{}).value||'';
        trx=(document.getElementById('pay-trx')||{}).value||'';
        if(!sender.trim()||!trx.trim()){alert(t('Sender ও TrxID দিন','Enter sender & TrxID'));return;}
    }
    const cart=getCart();
    let subtotal=0; cart.forEach(i=>{ if(typeof i.price==='number')subtotal+=i.price*i.quantity; });
    const ship=parseInt(document.getElementById('shopping-area').value)||s.deliveryInside;
    const total=subtotal+ship;
    const now=new Date();
    const orderId='BQ-'+now.getFullYear()+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0')+'-'+String(Math.floor(Math.random()*9999)).padStart(4,'0');
    try {
        await addDoc(collection(db,'orders'),{orderId,name,phone,zila,address,notes,products:cart.map(i=>({docId:i.docId,name:i.name,price:i.price,size:i.size||'',color:i.color||'',quantity:i.quantity})),subtotal,deliveryCharge:ship,totalAmount:total,paymentMethod:sel.value,senderNumber:sender,trxId:trx,status:'pending',date:now.toISOString()});
        showToast('✅ Order ID: '+orderId);
        saveCart([]);
        updateCartUI();
        setTimeout(()=>switchTab('home'),1500);
    } catch(err){ alert('❌ '+err.message); }
};

// ===== MINI CART =====
window.openMiniCart = function(){ renderMiniCart(); document.getElementById('mini-cart-overlay').classList.add('active'); document.getElementById('mini-cart-sidebar').classList.add('active'); };
window.closeMiniCart = function(){ document.getElementById('mini-cart-overlay').classList.remove('active'); document.getElementById('mini-cart-sidebar').classList.remove('active'); };
window.renderMiniCart = function(){ const body=document.getElementById('mini-cart-body'), foot=document.getElementById('mini-cart-footer'), sub=document.getElementById('mini-cart-subtotal'); const cart=getCart(); if(cart.length===0){ body.innerHTML=`<div class="mini-cart-empty"><i class="fas fa-shopping-bag"></i><p>${t('কার্ট খালি','Cart empty')}</p><button class="mini-cart-shop-btn" onclick="closeMiniCart();switchTab('shop')">Shop Now</button></div>`; foot.style.display='none'; return; } let st=0, h=''; cart.forEach((it,i)=>{ const lt=typeof it.price==='number'?it.price*it.quantity:0; if(typeof it.price==='number')st+=lt; const pt=typeof it.price==='number'?('৳ '+it.price+' × '+it.quantity):'Coming Soon'; h+=`<div class="mini-cart-item"><img src="${it.image}" class="mini-cart-item-img"><div class="mini-cart-item-info"><div class="mini-cart-item-name">${it.name}</div><div class="mini-cart-item-price">${pt}</div></div><button class="mini-cart-item-remove" onclick="removeFromCart(${i});renderMiniCart();"><i class="fas fa-trash-alt"></i></button></div>`; }); body.innerHTML=h; foot.style.display='block'; if(sub)sub.textContent='৳ '+st; };

// ===== ORDER TRACK =====
window.trackCustomerOrder = async function() {
    const inp=document.getElementById('order-track-input'), res=document.getElementById('order-track-result'); if(!inp||!res)return;
    const oid=inp.value.trim().toUpperCase(); if(!oid){res.style.display='block';res.innerHTML='<p style="color:#fca5a5;">Order ID দিন</p>';return;}
    res.style.display='block'; res.innerHTML='<p style="text-align:center;padding:20px;color:var(--gold);"><i class="fas fa-spinner fa-spin"></i></p>';
    try { const snap=await getDocs(collection(db,'orders')); let found=null; snap.forEach(d=>{const x=d.data(); if((x.orderId||'').toUpperCase()===oid)found=x;}); if(!found){res.innerHTML='<div style="padding:15px;background:rgba(239,68,68,.15);border:1px solid #ef4444;border-radius:10px;text-align:center;color:#fca5a5;">Order পাওয়া যায়নি</div>';return;} const isDone=found.status==='completed'; res.innerHTML=`<div style="background:var(--card);border:1.5px solid var(--gold);border-radius:14px;padding:15px;"><div style="display:flex;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;"><div style="color:var(--gold);font-weight:800;">📦 ${found.orderId}</div><span style="padding:4px 12px;background:${isDone?'rgba(34,197,94,.15)':'rgba(245,158,11,.15)'};border:1px solid ${isDone?'#22c55e':'#f59e0b'};color:${isDone?'#86efac':'#fcd34d'};border-radius:15px;font-size:11px;font-weight:700;">${isDone?'✅ Complete':'⏳ Pending'}</span></div><div style="font-size:12px;line-height:1.8;"><div><strong style="color:var(--gold);">নাম:</strong> ${found.name||''}</div><div><strong style="color:var(--gold);">ফোন:</strong> ${found.phone||''}</div><div><strong style="color:var(--gold);">জেলা:</strong> ${found.zila||''}</div><div><strong style="color:var(--gold);">ঠিকানা:</strong> ${found.address||''}</div><div><strong style="color:var(--gold);">Total:</strong> ৳${found.totalAmount||0}</div></div></div>`; } catch(e){ res.innerHTML='<p style="color:#fca5a5;">Error</p>'; }
};

// ===== TOAST =====
window.showToast = function(msg){ const t=document.getElementById('custom-toast'); if(!t)return; document.getElementById('toast-message').textContent=msg; t.classList.add('toast-visible'); clearTimeout(window._toastTimer); window._toastTimer=setTimeout(()=>t.classList.remove('toast-visible'),2500); };

// ===== LANG =====
window.setLang = function(lang){ window.LANG=lang; localStorage.setItem('bq_lang',lang); document.getElementById('lang-bn').classList.toggle('active',lang==='bn'); document.getElementById('lang-en').classList.toggle('active',lang==='en'); applyI18n(); renderSidebarMenu(); if(document.getElementById('cart-section').classList.contains('active-page')) updateCartUI(); };
function applyI18n(){ document.querySelectorAll('[data-i18n]').forEach(el=>{ const k=el.getAttribute('data-i18n'); const map={cart:{bn:'কার্ট',en:'Cart'},subtotal:{bn:'সাবটোটাল',en:'Subtotal'},view_cart:{bn:'কার্ট দেখুন',en:'View Cart'},checkout:{bn:'চেকআউট',en:'Checkout'},home:{bn:'হোম',en:'Home'},shop:{bn:'শপ',en:'Shop'},wishlist:{bn:'Wishlist',en:'Wishlist'},faq_title:{bn:'সাধারণ প্রশ্ন',en:'FAQ'},faq_sub:{bn:'আপনার প্রশ্নের উত্তর','en':'Your questions'},track_order:{bn:'📦 অর্ডার ট্র্যাক','en':'📦 Track Order'},track_order_sub:{bn:'Order ID দিয়ে স্ট্যাটাস দেখুন','en':'Track with Order ID'},track:{bn:'ট্র্যাক','en':'Track'},cart_checkout:{bn:'কার্ট ও চেকআউট','en':'Cart & Checkout'},special_coupons:{bn:'বিশেষ কুপন','en':'Special Coupons'},our_collections:{bn:'আমাদের কালেকশন 👑','en':'OUR COLLECTIONS 👑'}}; if(map[k]) el.textContent=map[k][LANG]||map[k].bn; }); }

// ===== SIDEBAR =====
document.getElementById('openSidebar').addEventListener('click',()=>{ document.getElementById('sidebar').classList.add('active'); document.getElementById('overlay').classList.add('active'); });
document.getElementById('closeSidebar').addEventListener('click',()=>{ document.getElementById('sidebar').classList.remove('active'); document.getElementById('overlay').classList.remove('active'); });
document.getElementById('overlay').addEventListener('click',()=>{ document.getElementById('sidebar').classList.remove('active'); document.getElementById('overlay').classList.remove('active'); });

// ===== INIT =====
window.bootWebsite = function() {
    // instant from cache
    const s=fcGet('settings',null); if(s){ window.settingsCache={...DEFAULT_SETTINGS,...s}; applySettingsToWebsite(); applyExtendedSettings(); } else { window.settingsCache={...DEFAULT_SETTINGS}; applySettingsToWebsite(); applyExtendedSettings(); }
    const p=fcGet('products',null); if(p)updateProductsData(p);
    const b=fcGet('banners',null); if(b){window.bannersCache=b;renderBannerSlider();}
    const hc=fcGet('homeCollections',null); if(hc){window.homeCollectionsCache=hc;renderHomeCollections();}
    const cp=fcGet('coupons',null); if(cp){window.couponsCache=cp;renderHomeCoupons();}
    const f=fcGet('faq',null); if(f){window.faqCache=f;renderFAQ();}
    const pg=fcGet('pages',null); if(pg){window.pagesCache=pg;renderSidebarMenu();}
    const r=fcGet('reviews',null); if(r)window.reviewsCache=r;
    updateCartBadge();
    updateWishlistBadge();
    setTimeout(()=>document.getElementById('global-loader').classList.add('hidden'),300);
    preloadEverything().then(()=>startVersionCheck());
};

window.addEventListener('DOMContentLoaded',()=>{
    document.getElementById('lang-bn').classList.toggle('active',LANG==='bn');
    document.getElementById('lang-en').classList.toggle('active',LANG==='en');
    applyI18n();
    bootWebsite();
});

// prevent horizontal scroll/zoom on mobile
document.addEventListener('touchstart',function(e){ if(e.touches.length>1) e.preventDefault(); },{passive:false});
let lastTouch=0; document.addEventListener('touchend',function(e){ const now=Date.now(); if(now-lastTouch<=300){ e.preventDefault(); } lastTouch=now; },{passive:false});
</script>
